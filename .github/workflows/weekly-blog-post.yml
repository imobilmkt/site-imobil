name: Publicar post semanal no blog

on:
  schedule:
    # Toda segunda-feira às 10:00 (horário de Brasília, UTC-3) = 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch: {} # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar artigo (pesquisa + redação + validação)
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-weekly-post.mjs

      - name: Commit e push
        run: |
          git config user.name "imobil-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/ sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "Nada para commitar."
            exit 0
          fi
          git commit -m "Publica artigo semanal: ${{ steps.generate.outputs.title }}"
          git push
