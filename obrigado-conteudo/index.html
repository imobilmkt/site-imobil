  <style>
    :root{
      --dark:#13100B;
      --gold:#DDC095;
      --white:#F4F3F1;
      --font:'Plus Jakarta Sans', sans-serif;
    }
    *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      background:var(--dark);
      color:var(--white);
      font-family:var(--font);
      min-height:100svh;
      -webkit-font-smoothing:antialiased;
    }
    a{ color:inherit; }

    .brand{
      position:fixed; top:20px; left:20px; z-index:40;
      display:flex; align-items:center; gap:8px;
      font-weight:800; font-size:14px; letter-spacing:.02em; opacity:.9;
    }

    .wrap{
      min-height:100svh;
      display:flex; align-items:center; justify-content:center;
      padding:100px 24px 60px;
    }
    .card{ width:100%; max-width:520px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:20px; }

    .sub{ font-size:16px; font-weight:400; color:rgba(244,243,241,.65); line-height:1.7; }

    .btn-instagram{

      background:var(--gold); color:var(--dark);
      font-family:var(--font); font-weight:700; font-size:15px;
      padding:16px 28px; border:none; border-radius:8px;
      text-decoration:none; cursor:pointer;
      transition:transform .2s ease;
      box-shadow:0 8px 28px rgba(221,192,149,.25);
      margin-top:8px;
    }
    .btn-instagram:hover{ transform:translateY(-2px); }
